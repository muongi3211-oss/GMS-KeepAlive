name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          build-root-directory: GMS-Protect

      - name: Build APK
        run: gradle assembleDebug --stacktrace
        working-directory: GMS-Protect

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FcmGuard-Debug-APK
          path: GMS-Protect/app/build/outputs/apk/debug/*.apk
